<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NEXUS VISA CONSULTANCY</title>
    <link rel="stylesheet" href="global.css">
    
<body>
    <div class="auth-container">
        <div class="auth-form card">
            <h2><i class="fas fa-user-plus"></i> Create Account</h2>
            <form id="registerForm" onsubmit="event.preventDefault(); alert('Registration Successful! Please login.'); goToPage('login');">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px;">
                    <i class="fas fa-user-check"></i> Create Account
                </button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem;">
                Already have an account? 
                <a href="login.html" style="color: #667eea; font-weight: bold;">Login here</a>
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
