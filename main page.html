
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS VISA CONSULTANCY</title>

    <link rel="stylesheet" href="global.css">

</head>
<body>

<header class="header">

    <nav class="nav container">

        <div class="logo">
            <img src="NexusVisa Consultancy logo.png" alt="NexusVisa Consultancy Logo">
        </div>

        <ul class="nav-links">

            <li><a href="main page.html">Home</a></li>
            <li><a href="university.html">Universities</a></li>
            <li><a href="country.html">Countries</a></li>
            <li><a href="chat.html">Live Chat</a></li>
            <li><a href="login.html">Login</a></li>

        </ul>

    </nav>

</header>


<section class="hero">

    <div class="hero-content container">

        <h1>
            Your Dream University Awaits
        </h1>

        <p>
            Expert visa consultancy for studying abroad.
        </p>

        <a href="#searchSection" class="btn btn-primary">
            Find Universities
        </a>

        <a href="chat.html" class="btn btn-secondary">
            Live Chat
        </a>

    </div>

</section>


<section class="container" id="searchSection">

    <div class="search-form">

        <div class="search-box">

            <h2 class="search-title">
                🔍 Advanced University Search
            </h2>

            <div class="advanced-search-grid">

                <div class="form-group">

                    <label>Search University</label>

                    <input
                        type="text"
                        id="uniSearch"
                        placeholder="Search by university name..."
                    >

                </div>


                <div class="form-group">

                    <label>Select Country</label>

                    <select id="countryFilter">

                        <option value="">All Countries</option>
                        <option value="USA">USA</option>
                        <option value="UK">UK</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                        <option value="Germany">Germany</option>
                        <option value="Japan">Japan</option>
                        <option value="France">France</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Minimum Rating</label>

                    <select id="ratingFilter">

                        <option value="">Any Rating</option>
                        <option value="4.5">4.5+</option>
                        <option value="4.6">4.6+</option>
                        <option value="4.7">4.7+</option>
                        <option value="4.8">4.8+</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Budget Range</label>

                    <select id="feesFilter">

                        <option value="">Any Budget</option>
                        <option value="10000">Below 10K</option>
                        <option value="30000">Below 30K</option>
                        <option value="50000">Below 50K</option>

                    </select>

                </div>

            </div>

            <div class="search-info">

                <h3 id="resultCount">
                    Showing All Universities
                </h3>

            </div>

        </div>

    </div>

</section>


<section class="container">

    <div id="uniResults" class="results-grid">

    </div>

</section>


<footer class="footer">

    <div class="container">

        <p>
            2026 NEXUS. All rights reserved.
        </p>

    </div>

</footer>

<script src="script.js"></script>

</body>
</html>
